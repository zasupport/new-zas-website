name: SEO weekly audit

# Handoff §9-H. Scheduled, read-only production audit. Crawls priority URLs, runs the
# audit suite, produces a dated report artifact. Makes NO edits and NO deployments.
# Material regressions are surfaced as a report + (optional) issue for human review.

on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC (07:00 SAST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run read-only weekly audit against production
        run: node seo/scripts/generate-weekly-report.mjs --base https://zasupport.com

      - name: Upload dated report
        uses: actions/upload-artifact@v4
        with:
          name: seo-weekly-report
          path: seo/reports/weekly-audit-*.md
          retention-days: 90

      - name: Flag P0 search regression as an issue (no auto-fix)
        if: always()
        run: |
          set -e
          if node seo/scripts/audit-search.mjs --base https://zasupport.com; then
            echo "search OK"
          else
            echo "SEARCH_BROKEN=1" >> "$GITHUB_ENV"
          fi

      - name: Open issue on P0
        if: env.SEARCH_BROKEN == '1'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `P0: onsite search regression detected (${new Date().toISOString().slice(0,10)})`,
              body: 'The weekly read-only audit found `/api/search` returning non-200 for real queries. Diagnose and prepare an approval-gated fix branch. No auto-fix or deploy was performed.',
              labels: ['seo', 'P0'],
            });
