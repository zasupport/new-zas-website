name: URL Integrity Preview Validation
on:
  workflow_dispatch:
  push:
    branches: ['fix/canonical-integrity-*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Source, controls, and full build
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm run check:seo
          npm run check:reliability
          npm run check:urls
          npm run check:security
          npm run build
          npm run check:urls-rendered
      - name: Request-level preview and production safety
        run: |
          set -euo pipefail
          npm run start -- --port 3000 > /tmp/url-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test-url-runtime.mjs
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: url-preview-validation-${{ github.sha }}
          path: .reliability/url-*.json
          if-no-files-found: error
          include-hidden-files: true
