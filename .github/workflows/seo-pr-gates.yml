name: SEO PR gates

# Handoff §9-H. Non-destructive PR gate: typecheck, lint, build (generates the
# search index), SEO unit tests, existing SEO checks, and Playwright e2e against a
# local production build. Never deploys, never edits, never publishes.

on:
  pull_request:
    paths:
      - 'seo/**'
      - 'src/app/search/**'
      - 'src/app/api/search/**'
      - 'src/app/sitemap.ts'
      - 'src/app/robots.ts'
      - 'tests/**'
      - 'docs/seo/**'
      - '.github/workflows/seo-pr-gates.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write  # read-only diagnostic step comments the failure class on the PR (no code write)

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build search index (deterministic, keyless)
        run: npm run search:index

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: SEO unit tests (facts register, schema, canonical, metadata, sitemap)
        run: node --test tests/seo/*.test.ts

      - name: Existing SEO checks (robots/sitemap/noindex drift)
        run: npm run check:seo

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E (search, conversions, rendering) against local build
        run: |
          set -o pipefail   # preserve the real exit code; tee must not mask a failure
          npx playwright test 2>&1 | tee e2e-output.log
        env:
          BASE_URL: http://localhost:3000
          CI: 'true'

      # Read-only diagnostic (option b). Runs ONLY on failure, same-repo PRs only (never forks).
      # Does NOT change the gate result, never edits code, never opens a PR; it posts/updates ONE
      # marked PR comment classifying the failure so the next session starts at root cause.
      - name: Diagnose gate failure (read-only; posts the failure class to the PR)
        if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true   # observability-only; the real failure is already recorded by the step above
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ci-classify-gate-failure.sh e2e-output.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
